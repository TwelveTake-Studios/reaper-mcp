[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twelvetake-reaper-mcp"
version = "1.6.2"
description = "MCP server for controlling REAPER DAW - mixing, mastering, MIDI composition, and full music production"
readme = "README.md"
license = "MIT"
# CI tests 3.10 through 3.13. Claiming 3.8 gave those users a clean install and a broken
# runtime, plus a dependency resolver error naming somebody else's package.
requires-python = ">=3.10"
authors = [
    { name = "TwelveTake Studios LLC", email = "contact@twelvetake.com" }
]
keywords = [
    "reaper",
    "daw",
    "mcp",
    "model-context-protocol",
    "music-production",
    "mixing",
    "mastering",
    "midi",
    "audio",
    "claude",
    "ai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Capped below 2.0: mcp 2.0 moved/removed `mcp.server.fastmcp`, which this server imports
    # at module scope, so an unbounded constraint resolves to a version that cannot start.
    # Raise the cap only after porting to whatever 2.x calls FastMCP.
    "mcp>=1.2.0,<2.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    # Embedded Lua, for the headless bridge-encoder regression test (tests/test_bridge_encoder.py).
    # Skipped automatically where unavailable, so its absence never fails the suite.
    "lupa>=2.0",
]

[project.urls]
Homepage = "https://twelvetake.com"
Repository = "https://github.com/TwelveTake-Studios/reaper-mcp"
Issues = "https://github.com/TwelveTake-Studios/reaper-mcp/issues"
Funding = "https://buymeacoffee.com/twelvetake"

[project.scripts]
twelvetake-reaper-mcp = "reaper_mcp_server:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "reaper_mcp_server.py",
]
# The bridge script must ship in the WHEEL, not just the sdist. The documented install
# is `uvx twelvetake-reaper-mcp`, which resolves to a wheel and unpacks into a throwaway
# cache, so before 1.6.1 the headline install handed users a server and no bridge, with
# no site-packages path to dig it out of. `--install-bridge` deploys this copy.
[tool.hatch.build.targets.wheel.force-include]
"reaper_mcp_bridge.lua" = "reaper_mcp_bridge.lua"

[tool.hatch.build.targets.sdist]
include = [
    "reaper_mcp_server.py",
    "reaper_mcp_bridge.lua",
    "reaper_web_server.py",
    "reaper_web_server.lua",
    "README.md",
    "LICENSE",
    "requirements.txt",
    "test_connection.py",
]
exclude = [
    ".claude/",
    ".github/",
    "docs/",
    "assets/",
    "tests/",
    "__pycache__/",
    "*.md",
    "!README.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# reaper_web_server.py runs INSIDE REAPER with injected RPR_* globals — it is not a
# standard Python module, so exclude it from linting (and it is deprecated).
extend-exclude = ["reaper_web_server.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# REAPER bridge globals (RPR_*) are injected at runtime; allow bare except in glue code.
ignore = ["E501", "E722", "F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a running REAPER with reaper_mcp_bridge.lua loaded (opt-in: pytest -m live)",
]
